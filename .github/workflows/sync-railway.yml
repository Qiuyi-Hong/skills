name: Sync Railway skill

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-railway
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: railwayapp/railway-skills
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Update skill
        run: npm run sync:railway -- upstream
      - name: Check sync
        run: npm run typecheck && npm test
      - name: Open or update review PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-railway
          title: 'chore: sync Railway skill from upstream'
          reviewers: Qiuyi-Hong
          commit-message: 'chore: sync Railway skill from upstream'
          body: 'Review upstream changes, including any change to the saved upstream description. The published description stays local.'
          add-paths: |
            skills/use-railway
            licenses/railway-skills.LICENSE
            scripts/railway-upstream-description.txt
          delete-branch: true
